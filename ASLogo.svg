<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Left Lobe Gradient: Soft Periwinkle to Deep Google Blue -->
    <linearGradient id="leftSliceGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#8AB4F8" />
      <stop offset="35%" stop-color="#4285F4" />
      <stop offset="100%" stop-color="#1967D2" />
    </linearGradient>

    <!-- Center Bridge Slice Gradient: Google Blue -> Teal -> Health Green -->
    <linearGradient id="midSliceGrad" x1="10%" y1="85%" x2="90%" y2="15%">
      <stop offset="0%" stop-color="#1A73E8" />
      <stop offset="48%" stop-color="#00BFA5" />
      <stop offset="82%" stop-color="#00C853" />
      <stop offset="100%" stop-color="#00A844" />
    </linearGradient>

    <!-- Bottom-Right Pill Slice Gradient: Warm Yellow -> Orange -> Coral Pink -->
    <linearGradient id="rightSliceGrad" x1="88%" y1="12%" x2="18%" y2="92%">
      <stop offset="0%" stop-color="#FFD600" />
      <stop offset="28%" stop-color="#FF9100" />
      <stop offset="68%" stop-color="#FF5252" />
      <stop offset="100%" stop-color="#FF4081" />
    </linearGradient>

    <!-- Left Companion Node Gradient -->
    <linearGradient id="headLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8AB4F8" />
      <stop offset="100%" stop-color="#2B7DE9" />
    </linearGradient>

    <!-- Right Companion Node Gradient -->
    <linearGradient id="headRightGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00BFA5" />
      <stop offset="100%" stop-color="#00C853" />
    </linearGradient>

    <!-- Clip Path for the Right Lobe Seamless Color Split -->
    <clipPath id="heartBodyClip">
      <!-- Slice 1: Left Lobe + V-groove into Central Bridge -->
      <path d="M 192 260 
               L 252 170 
               C 260 158, 253 144, 238 140 
               C 145 118, 64 195, 64 286 
               C 64 348, 128 408, 188 462 
               C 200 473, 216 469, 226 454 
               L 352 272 
               C 405 224, 442 222, 466 238 
               C 456 172, 396 130, 336 136 
               C 295 140, 264 166, 236 205 
               Z" />
    </clipPath>
  </defs>

  <!-- ================= SATHI COMPANION HEADS ================= -->
  <circle cx="176" cy="88" r="32" fill="url(#headLeftGrad)" />
  <circle cx="336" cy="88" r="32" fill="url(#headRightGrad)" />

  <!-- ================= SLICED GOOGLE HEALTH HEART ================= -->
  
  <!-- 1. Main Heart Body (Left Lobe + Diagonal Cut + Upper Right Bridge) -->
  <g clip-path="url(#heartBodyClip)">
    <!-- Base Layer: Central Bridge Gradient (Blue to Teal to Green) -->
    <rect x="50" y="110" width="430" height="380" fill="url(#midSliceGrad)" />

    <!-- Top-Left Lobe Overlay with Soft Fold Separation -->
    <path d="M 60 110 
             L 265 110 
             L 192 260 
             L 140 340 
             L 60 340 Z" fill="url(#leftSliceGrad)" />
  </g>

  <!-- 2. Crisp Diagonal White V-Notch & Inner Slice Detail -->
  <!-- Recreates the signature Google Health upper-left notch and bottom-right split -->
  <path d="M 192 260 
           L 249 166 
           C 256 155, 249 142, 234 139 
           C 144 118, 64 195, 64 286 
           C 64 348, 128 408, 188 462 
           C 200 473, 215 469, 225 454 
           L 348 276 
           C 394 234, 434 224, 465 236 
           C 454 170, 396 130, 336 136 
           C 296 140, 266 168, 240 205 
           L 195 262 Z" fill="none" />

  <!-- 3. Bottom-Right Detached Pill Slice (Yellow -> Orange -> Coral Pink) -->
  <!-- Separated by a clean parallel diagonal white gap, curving seamlessly at the top-right -->
  <path d="M 358 294 
           L 240 465 
           C 228 483, 242 504, 264 497 
           C 276 493, 290 482, 306 468 
           C 386 396, 468 328, 468 262 
           C 468 252, 467 244, 465 236 
           C 434 224, 396 239, 358 294 Z" fill="url(#rightSliceGrad)" />
</svg>