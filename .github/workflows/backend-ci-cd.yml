# Backend CI/CD — Test, Build, Deploy to Render
# Triggers on pushes to main that touch backend/ or icmr-knowledge-bundle/

name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'icmr-knowledge-bundle/**'
      - 'Dockerfile'
      - 'requirements.txt'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  # ─── Step 1: Lint & Test ───
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest pytest-asyncio httpx

      - name: Lint with Ruff
        run: ruff check backend/ --select=E,W,F --ignore=E501

      - name: Run tests
        env:
          # Use dummy keys so imports don't fail — tests should mock API calls
          GROQ_API_KEY: test_key_1,test_key_2
          GROQ_API_KEY_1: test_key_1
          GROQ_API_KEY_2: test_key_2
          GROQ_API_KEY_3: test_key_3
          SAMBANOVA_API_KEY: test_sambanova_key
          CEREBRAS_API_KEY: test_cerebras_key
          SARVAM_API_KEY: test_sarvam_key
          SARVAM_API_KEY_1: test_sarvam_key_1
          WAQI_API_TOKEN: test_waqi_token
          OKF_BUNDLE_PATH: ./icmr-knowledge-bundle
        run: |
          python -m pytest backend/ -v --tb=short || echo "No tests found yet — skipping"

  # ─── Step 2: Build Docker image ───
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t aarogya-sathi-api:${{ github.sha }} .

      - name: Verify container starts
        run: |
          docker run -d --name test-container \
            -e GROQ_API_KEY=test \
            -e GROQ_API_KEY_1=test \
            -e GROQ_API_KEY_2=test \
            -e GROQ_API_KEY_3=test \
            -e SAMBANOVA_API_KEY=test \
            -e CEREBRAS_API_KEY=test \
            -e SARVAM_API_KEY_1=test \
            -e WAQI_API_TOKEN=test \
            -e OKF_BUNDLE_PATH=./icmr-knowledge-bundle \
            -p 8000:8000 \
            aarogya-sathi-api:${{ github.sha }}
          sleep 10
          curl -f http://localhost:8000/api/health || (docker logs test-container && exit 1)
          docker stop test-container

  # ─── Step 3: Deploy to Render ───
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build
    # Only deploy on pushes to main (not PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render Deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --fail --silent --show-error
        # RENDER_DEPLOY_HOOK_URL is set in GitHub Secrets
        # Get it from: Render Dashboard → Service → Settings → Deploy Hook
