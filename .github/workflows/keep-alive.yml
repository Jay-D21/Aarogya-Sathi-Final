# Keep-Alive Ping — Prevents Render free tier from sleeping
# Pings the health endpoint every 14 minutes so the server never goes idle

name: Keep Alive

on:
  # Cron disabled — enable when Render deployment is active
  # schedule:
  #   - cron: '*/14 * * * *'
  # Manual trigger only for now
  workflow_dispatch:

jobs:
  ping:
    name: Ping Health Endpoint
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render backend
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.RENDER_API_URL }}" \
            --max-time 30)
          echo "Health check response: $RESPONSE"
          if [ "$RESPONSE" != "200" ]; then
            echo "⚠️ Server returned $RESPONSE — may be cold starting"
          else
            echo "✅ Server is alive"
          fi
