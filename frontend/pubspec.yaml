name: frontend
description: "Aarogya Sathi - Personal AI Health Companion"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  http: ^1.6.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.0.0
  google_fonts: ^8.0.2
  intl: ^0.19.0
  uuid: ^4.5.3
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  geolocator: ^14.0.2
  flutter_local_notifications: ^21.0.0
  pedometer: ^4.2.0
  timezone: ^0.11.0
  geocoding: ^4.0.0
  url_launcher: ^6.3.1
  health: ^11.0.0
  image_picker: ^1.2.3
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# Flutter launcher icon configuration
# Source: assets/images/icon.png (1024×1024 gold mandala logo - background removed)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#00000000"
  adaptive_icon_foreground: "assets/images/icon.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false

flutter:
  uses-material-design: true

  # Register logo asset so it can be used on splash & other screens
  assets:
    - assets/images/app_logo.jpg
    - assets/images/icon.png
