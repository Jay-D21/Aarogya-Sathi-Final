# Render Blueprint — Infrastructure as Code
# Deploy with: https://render.com/deploy?repo=<your-github-repo-url>

services:
  - type: web
    name: aarogya-sathi-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore  # Closest to India for low latency
    healthCheckPath: /api/health
    envVars:
      # LLM Providers — comma-separated keys for multi-key rotation
      - key: GROQ_API_KEY
        sync: false
      - key: SAMBANOVA_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      # Translation — Sarvam AI (comma-separated keys for rotation)
      - key: SARVAM_API_KEY
        sync: false
      # Environmental Data
      - key: WAQI_API_TOKEN
        sync: false
      # Knowledge Bundle Path (inside Docker container)
      - key: OKF_BUNDLE_PATH
        value: ./icmr-knowledge-bundle
